services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docappoint_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-docappoint}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@docappoint.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
      RAZORPAY_KEY_ID: ${KEY_ID}
      RAZORPAY_KEY_SECRET: ${KEY_SECRET}
      CURRENCY: ${CURRENCY:-INR}
      AI_AGENT_URL: http://ai-agent:8000
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
    networks:
      - docappoint_net

  ai-agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    container_name: docappoint_ai_agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      BACKEND_URL: http://backend:3001
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-docappoint}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - docappoint_net

networks:
  docappoint_net:
    driver: bridge
